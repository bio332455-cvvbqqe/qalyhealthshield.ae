/* Brand colours (Qaly Health Shield / Bioscript Center guidelines) */
:root {
  --white: #FFFFFF;
  --ice: #E8F4FC;
  --sky: #71B5E2;
  --pale: #B9DAF1;
  --ink: #021A91;      /* dark blue: text, icon lines and hairlines only */
  --charcoal: #333A48; /* body text */
  --grey: #626C7C;     /* captions */
  --orange: #F26B1D;   /* full stop only */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Dubai Web", "Dubai", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  background: var(--white);
  color: var(--charcoal);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

header {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 16px 8px;
  text-align: center;
}

.logo-link { display: inline-block; border-radius: 12px; }
.logo-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.logo { display: block; width: min(260px, 70vw); height: auto; }

.eyebrow {
  margin-top: 32px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink);
}

h1 {
  margin-top: 8px;
  font-weight: 700;
  font-size: clamp(34px, 8vw, 48px);
  line-height: 1.1;
  color: var(--ink);
}

.dot { color: var(--orange); }

.lead {
  margin: 12px auto 0;
  font-size: 18px;
  line-height: 1.5;
  max-width: 34ch;
}

.actions {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 10px 22px;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 700;
  font-size: 17px;
  text-decoration: none;
  color: var(--ink);
  border: 1px solid var(--pale);
  background: var(--white);
  transition: background-color .15s ease, border-color .15s ease;
}

.btn svg { width: 20px; height: 20px; flex: none; }

.btn-primary { background: var(--sky); border-color: var(--sky); }
.btn-primary:hover { background: #4B97C8; border-color: #4B97C8; }
.btn:not(.btn-primary):hover { background: var(--ice); border-color: var(--sky); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.btn small { font-weight: 400; font-size: 14px; }

.hint {
  margin-top: 16px;
  font-size: 14px;
  color: var(--grey);
}

main {
  flex: 1;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.pages { list-style: none; display: grid; gap: 16px; }

.pages img {
  display: block;
  width: 100%;
  height: auto;
